<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comp Sci Enthusiasts Newsletter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <header class="bg-dark text-white text-center py-4 mb-4">
    <h1> Comp Sci Enthusiasts Newsletter</h1>
    <p class="lead">A newsletter sent to your email on the first of every month, updating you on the world of Computer Science!</p>
  </header>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <h2 class="h4">Join the Club!</h2>

            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control mb-3" id="firstName">

            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control mb-3" id="lastName">

            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control mb-3" id="email">

            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password">
            <div class="form-text mb-3">Must contain a special character: ! or ?</div>

            <label for="dob" class="form-label">Date of Birth</label>
            <input type="date" class="form-control mb-3" id="dob">

            <button type="button" class="btn btn-primary w-100" onclick="register()">Register</button>
          </div>
        </div>

        <!-- The result message gets written here -->
        <div id="result"></div>

      </div>
    </div>
  </div>

  <script>
    function register() {
      // This will turn the input into a User object
      var user = {
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        dob: document.getElementById("dob").value
      };

      // This validates that all inputs meet requirements (such as password having a special character)
      var allFilled = user.firstName !== "" && user.lastName !== "" &&
                      user.email !== "" && user.password !== "" && user.dob !== "";
      var hasSpecial = user.password.includes("!") || user.password.includes("?");

      var output = "";

      if (allFilled && hasSpecial) {
        // This will change the input in the password field to asterisks for security
        var stars = "";
        for (var i = 0; i < user.password.length; i++) {
          stars = stars + "*";
        }
        user.password = stars;

        // This makes sure the registration worked, and if not will print an error
        output = "<div class='alert alert-success'>" +
                 "<h3>Registration Successful! Welcome to the newsletter!</h3>" +
                 "<p><strong>First Name:</strong> " + user.firstName + "</p>" +
                 "<p><strong>Last Name:</strong> " + user.lastName + "</p>" +
                 "<p><strong>Email Address:</strong> " + user.email + "</p>" +
                 "<p><strong>Password:</strong> " + user.password + "</p>" +
                 "<p><strong>Date of Birth:</strong> " + user.dob + "</p>" +
                 "</div>";
      } else {
        output = "<div class='alert alert-danger'><h3>Registration Failed</h3>";
        if (!allFilled) {
          output = output + "<p>All fields must be filled out.</p>";
        }
        if (user.password !== "" && !hasSpecial) {
          output = output + "<p>Password must contain a special character (! or ?).</p>";
        }
        output = output + "</div>";
      }

      // This will write to the DOM
      document.getElementById("result").innerHTML = output;
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
